services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://teawork:teawork@db:5432/teawork_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-secret-change-me}
      IPINFO_GEOLOCATION_API_KEY: ${IPINFO_GEOLOCATION_API_KEY:-}
    ports:
      - 3001:3001
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teawork
      POSTGRES_PASSWORD: teawork
      POSTGRES_DB: teawork_db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teawork -d teawork_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
